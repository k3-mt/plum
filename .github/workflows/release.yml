name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # so `git describe` can stamp the version
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: make cross
      - name: package
        run: |
          cd dist
          for f in plum-*; do
            case "$f" in
              *.exe) base="${f%.exe}"; cp "$f" plum.exe; zip -q "$base.zip" plum.exe; rm plum.exe ;;
              *)     cp "$f" plum;    tar -czf "$f.tar.gz" plum;  rm plum ;;
            esac
          done
          sha256sum *.tar.gz *.zip > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true
